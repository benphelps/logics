<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ledgway logo options</title>
    <style>
      :root {
        --accent: #4fb6ff;
        --bg-dark: #0c1014;
        --bg-light: #f4f4f0;
        --ink-dark: #0c1014;
        --ink-light: #e9eef3;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 32px;
        background: #1a1f25;
        color: #e9eef3;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      h1 { font-weight: 500; letter-spacing: 0.04em; margin: 0 0 24px; }
      h2 { font-weight: 500; margin: 0 0 6px; font-size: 13px; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.12em; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 28px; }
      .card {
        padding: 24px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        gap: 24px;
        flex-wrap: wrap;
      }
      .card.dark  { background: var(--bg-dark);  color: var(--accent); }
      .card.light { background: var(--bg-light); color: #1d3a5c; }
      .card.accent { background: var(--accent);  color: var(--bg-dark); }
      .sizes { display: flex; align-items: flex-end; gap: 18px; }
      .sizes figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
      .sizes img { display: block; }
      .sizes figcaption { font-size: 10px; opacity: 0.55; }
      .wordmark {
        font: 600 22px/1 "Helvetica Neue", Helvetica, Arial, sans-serif;
        letter-spacing: 0.02em;
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .wordmark img { width: 28px; height: 28px; }
      .label {
        font-size: 12px;
        opacity: 0.6;
        margin: 32px 0 8px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .browser-tab {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #2a3038;
        color: #ccd4dc;
        padding: 8px 14px 8px 10px;
        border-radius: 8px 8px 0 0;
        font-size: 12px;
        margin-right: 8px;
      }
      .browser-tab img { width: 16px; height: 16px; }
      .tabs-row { padding-bottom: 0; border-bottom: 2px solid #2a3038; margin-bottom: 24px; }
    </style>
  </head>
  <body>
    <h1>Ledgway — logo options</h1>

    <div class="label">Browser tabs (16px)</div>
    <div class="tabs-row">
      <span class="browser-tab"><img src="option-1-route.svg" alt=""> Ledgway</span>
      <span class="browser-tab"><img src="option-2-bars.svg" alt=""> Ledgway</span>
      <span class="browser-tab"><img src="option-3-hex.svg" alt=""> Ledgway</span>
      <span class="browser-tab"><img src="option-4-arrow.svg" alt=""> Ledgway</span>
      <span class="browser-tab"><img src="option-5-wedge.svg" alt=""> Ledgway</span>
    </div>

    <template id="row-tpl"></template>

    <div id="grid"></div>

    <script>
      const options = [
        { id: 1, file: "option-1-route.svg", name: "Route",  note: "L-bend trade lane between two stations" },
        { id: 2, file: "option-2-bars.svg",  name: "Bars",   note: "Three ascending bars — chart / growth" },
        { id: 3, file: "option-3-hex.svg",   name: "Hex",    note: "Hexagonal station with central dot" },
        { id: 4, file: "option-4-arrow.svg", name: "Arrow",  note: "Up-and-right turn — logistics path" },
        { id: 5, file: "option-5-wedge.svg", name: "Wedge",  note: "Triangular ship advancing along a route" },
      ];
      const sizes = [16, 24, 32, 48, 96];
      const grid = document.getElementById("grid");

      for (const opt of options) {
        const block = document.createElement("section");
        block.innerHTML = `
          <h2>${opt.id}. ${opt.name} <span style="opacity:.55; font-weight:400; text-transform:none; letter-spacing:0">— ${opt.note}</span></h2>
          <div class="row">
            <div class="card dark">
              <div class="sizes">
                ${sizes.map(s => `
                  <figure>
                    <img src="${opt.file}" width="${s}" height="${s}" alt="">
                    <figcaption>${s}px</figcaption>
                  </figure>`).join("")}
              </div>
              <div class="wordmark"><img src="${opt.file}" alt=""> Ledgway</div>
            </div>
            <div class="card light">
              <div class="sizes">
                ${sizes.map(s => `
                  <figure>
                    <img src="${opt.file}" width="${s}" height="${s}" alt="">
                    <figcaption>${s}px</figcaption>
                  </figure>`).join("")}
              </div>
              <div class="wordmark"><img src="${opt.file}" alt=""> Ledgway</div>
            </div>
          </div>
        `;
        grid.appendChild(block);
      }
    </script>
  </body>
</html>
