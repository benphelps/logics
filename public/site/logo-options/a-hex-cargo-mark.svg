  <path d="M58 18 L51 17.2 M58 18 L57.2 25" stroke="#d7a04f" stroke-width="2.6" stroke-linecap="round"/>
  <!-- data dots -->
  <circle cx="22" cy="38" r="2" fill="#dce8f5"/>
  <circle cx="34" cy="42" r="2" fill="#dce8f5"/>
  <circle cx="46" cy="26" r="2" fill="#dce8f5"/>
</svg>
